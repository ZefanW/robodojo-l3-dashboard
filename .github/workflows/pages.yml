name: Deploy validated results dashboard
on:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/validate_static_dashboard.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify static artifact paths and mirrored bytes
        run: python3 scripts/validate_static_dashboard.py web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy read-only snapshot
        id: deployment
        uses: actions/deploy-pages@v4
