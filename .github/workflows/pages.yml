name: Deploy validated results dashboard
on:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', 'docs/API.md', 'examples/api_client.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify static artifact paths and mirrored bytes
        run: python3 scripts/validate_static_dashboard.py web
      - name: Verify API contracts
        run: python3 -m unittest discover -s scripts -p 'test_api.py' -v
      - name: Verify fixed evaluation selection and scoring
        run: python3 -m unittest discover -s scripts -p 'test_evaluation_scores.py' -v
      - name: Verify API cost assumptions and dashboard interactions
        run: |
          node scripts/test_api_cost.js
          NODE_BINARY=node python3 -m unittest discover -s scripts -p 'test_dashboard_ui.py' -v
      - name: Build complete public data API from this snapshot
        run: python3 scripts/build_api.py web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy read-only snapshot
        id: deployment
        uses: actions/deploy-pages@v4
